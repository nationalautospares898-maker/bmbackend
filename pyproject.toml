[project]
name = "bm"
version = "0.1.0"
description = "National Auto Spares — billing and inventory backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    # The ceiling moved from `<0.120` because that window transitively pinned
    # `starlette<0.49.0`, and every Starlette release below 1.3.1 carries at least one
    # published advisory (three of them HIGH). FastAPI dropped its own Starlette ceiling
    # in 0.133.0, so this is the floor that makes a patched Starlette reachable at all.
    #
    # The ceiling stops at `<0.142` deliberately rather than being removed: from 0.142.0
    # FastAPI adds a runtime dependency on `opentelemetry-api`, whose releases below
    # 1.45.1 carry CVE-2026-114603. Taking it would trade one finding for another and put
    # a package this application never calls into a financial runtime. 0.141.1 post-dates
    # Starlette 1.3.1, so it is a combination upstream developed against — not a gap we
    # found by removing a bound. Moving past 0.142 later is fine, but then
    # `opentelemetry-api>=1.45.1` has to be declared and kept patched too.
    "fastapi>=0.141.1,<0.142",
    # Declared directly, though it arrives via FastAPI, because the floor here IS the
    # security requirement and belongs where someone changing it will see why:
    # 1.3.1 is the first release clear of all six advisories affecting 0.48.0
    # (CVE-2025-62727, CVE-2026-54283, CVE-2026-48710, CVE-2026-54282, CVE-2026-48818,
    # CVE-2026-48817). Leaving it implicit is how 0.48.0 was reached in the first place.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.18,<0.1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    # `<9` blocked the only fix for CVE-2025-71176 (insecure `tmpdir` handling, patched in
    # 9.0.3). Dev-only and locally scoped, but it is a real finding and `pip-audit` has no
    # severity threshold, so it reports regardless. `pytest-cov>=6.0,<8` needs no change:
    # 7.1.0 requires only `pytest>=7`.
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0,<8",
    "hypothesis>=6.112,<7",
    "httpx>=0.27,<0.29",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "types-python-dateutil>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bm"]

# --- ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "BLE",      # blind except — a swallowed error in a financial path is unacceptable
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff
    "ASYNC",    # async misuse
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "RUF012", # ClassVar annotations not required for SQLAlchemy/pydantic config dicts
]

# Mathematical and typographic characters used deliberately in documentation. `2 × 1250`
# reads better than `2 x 1250` in an arithmetic explanation, and these cannot be
# confused for identifiers because they only ever appear in prose.
allowed-confusables = ["×", "−", "–", "≤", "≥", "→", "₹"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"migrations/**" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["bm"]

# --- mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/bm"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# The domain layer holds the money and stock rules; it is strict without exception.
[[tool.mypy.overrides]]
module = "bm.domain.*"
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["argon2.*", "jwt.*", "openpyxl.*"]
ignore_missing_imports = true

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not slow"` makes the marker's own description true. The load suite needs a
# deliberately seeded 100 000-product catalogue (`scripts/seed_demo.py`) and takes
# minutes; run it on purpose with `pytest tests/load -m slow`. Without this the default
# loop collected it and silently skipped — which looks the same as passing.
addopts = "-q --strict-markers --strict-config -m 'not slow'"
markers = [
    "db: requires a real PostgreSQL database (SQLite is prohibited, ADR-017)",
    "concurrency: uses real parallel connections",
    "slow: excluded from the default developer loop",
]
filterwarnings = ["error::DeprecationWarning:bm.*"]

[tool.coverage.run]
source = ["src/bm"]
branch = true
omit = ["src/bm/worker.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
