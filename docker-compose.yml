# Local development and CI. Not a production topology.
#
# Two database roles exist here exactly as they do in production (`SECURITY.md §7`):
# `bm_migrate` holds DDL rights and is used only by the migration step; `bm_app` is the
# application role that the API and worker connect as, and whose UPDATE/DELETE rights on
# the append-only tables are revoked by the migrations themselves.

name: bm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bm_migrate
      POSTGRES_PASSWORD: bm_migrate_local_only
      POSTGRES_DB: bm
      # Deterministic collation keeps search ranking identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "55439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bm_migrate -d bm"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      # Only this container gets the DDL-capable credential.
      BM_MIGRATION_DATABASE_URL: postgresql+psycopg://bm_migrate:bm_migrate_local_only@postgres:5432/${BM_LOCAL_DATABASE_NAME:-bm}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      BM_ENV: local
      BM_DATABASE_URL: postgresql+psycopg://bm_app:bm_app_local_only@postgres:5432/${BM_LOCAL_DATABASE_NAME:-bm}
      BM_JWT_SIGNING_KEY: local-development-only-signing-key-not-a-secret
      BM_PASSWORD_PEPPER: local-development-only-password-pepper-xxx
      BM_IP_HASH_PEPPER: local-development-only-ip-hash-pepper-xxxx
      BM_CORS_ALLOWED_ORIGINS: http://localhost:5173
      BM_ENABLE_API_DOCS: "true"
      BM_LOG_FORMAT: console
      BM_STORAGE_BACKEND: local
      BM_STORAGE_PATH: /var/lib/bm/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The **test** API: a second process, on its own port, against its own database.
  #
  # Why this exists. The browser acceptance suite drives a real API and writes real rows
  # — products, invoices, payments, stock movements. Until now it drove the API on 8000,
  # which is the one the owner's application uses, so every acceptance run deposited test
  # data into the shop's own database. With the owner's real business now living in `bm`
  # that is no longer merely untidy; it would be writing invented invoices into their
  # books.
  #
  # Separating by **process and database**, rather than by convention, is what makes it
  # impossible rather than discouraged: this container cannot reach `bm` because it has
  # no credential for it.
  #
  # Behind a profile, so `docker compose up -d` still brings up only the shop's stack.
  # Start it with:  docker compose --profile e2e up -d api-e2e
  api-e2e:
    profiles: ["e2e"]
    build:
      context: .
      target: runtime
    environment:
      BM_ENV: local
      BM_DATABASE_URL: postgresql+psycopg://bm_app:bm_app_local_only@postgres:5432/bm_e2e
      BM_JWT_SIGNING_KEY: local-development-only-signing-key-not-a-secret
      BM_PASSWORD_PEPPER: local-development-only-password-pepper-xxx
      BM_IP_HASH_PEPPER: local-development-only-ip-hash-pepper-xxxx
      BM_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost:4273
      BM_ENABLE_API_DOCS: "true"
      BM_LOG_FORMAT: console
      BM_STORAGE_BACKEND: local
      BM_STORAGE_PATH: /var/lib/bm/storage
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "bm.worker"]
    # The image's healthcheck curls `/healthz`, which only the **API** serves — so the
    # worker reported `unhealthy` for its whole life while running perfectly and logging
    # `worker_started`. A permanently-red container is worse than no check: it trains
    # everyone to ignore the column that is supposed to mean something.
    #
    # Replaced with a check of the thing that actually matters for this process: that it
    # can reach the database it polls for jobs.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,psycopg; psycopg.connect(os.environ['BM_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()\" || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      BM_ENV: local
      BM_DATABASE_URL: postgresql+psycopg://bm_app:bm_app_local_only@postgres:5432/${BM_LOCAL_DATABASE_NAME:-bm}
      BM_JWT_SIGNING_KEY: local-development-only-signing-key-not-a-secret
      BM_PASSWORD_PEPPER: local-development-only-password-pepper-xxx
      BM_IP_HASH_PEPPER: local-development-only-ip-hash-pepper-xxxx
      BM_LOG_FORMAT: console
      BM_STORAGE_BACKEND: local
      BM_STORAGE_PATH: /var/lib/bm/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
